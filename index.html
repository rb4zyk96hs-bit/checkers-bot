<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Русские шашки</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101315;color:white;font-family:Arial,sans-serif}
 .menu-screen{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#101315 0%,#1a2025 100%);
  display:flex;flex-direction:column;
  padding:20px;z-index:500;
}
.menu-screen.hidden{display:none}

.menu-top{
  display:flex;justify-content:flex-end;
  margin-bottom:auto;
}
.menu-profile{
  display:flex;align-items:center;gap:8px;
  background:#171a1d;border:1px solid #34383c;
  border-radius:30px;padding:6px 14px 6px 6px;
  cursor:pointer;transition:border-color .2s;
}
.menu-profile:hover{border-color:#5a6270}
.menu-avatar{
  width:32px;height:32px;border-radius:50%;
  background:#2a4f8a;display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
#menuNick{
  font-weight:bold;font-size:14px;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.menu-buttons{
  display:flex;flex-direction:column;gap:14px;
  max-width:360px;width:100%;margin:0 auto 40px;
}
.menu-btn{
  border:0;border-radius:14px;padding:18px 20px;
  color:white;font-weight:bold;font-size:17px;
  text-align:left;cursor:pointer;
  transition:transform .1s, filter .15s;
  box-shadow:0 4px 12px #0006;
}
.menu-btn:hover{filter:brightness(1.1)}
.menu-btn:active{transform:scale(0.98)}

.menu-btn.play{background:linear-gradient(135deg,#28751d,#3aa52a)}
.menu-btn.create{background:linear-gradient(135deg,#7a2a8a,#a03ac9)}
.menu-btn.lobbies{background:linear-gradient(135deg,#2a4f8a,#3a6fb8)}
.menu-btn.shop{background:linear-gradient(135deg,#8a6b2a,#b8903a)}
.menu-btn.settings{background:linear-gradient(135deg,#444,#666)}
.game{max-width:520px;margin:auto;padding:10px}
.players{display:flex;justify-content:space-between;align-items:center;background:#171a1d;border:1px solid #34383c;border-radius:13px;padding:10px;font-weight:bold}
.p{display:flex;align-items:center;gap:7px}
.dot{width:25px;height:25px;border-radius:50%;border:2px solid #555}
.white{background:#eee}
.black{background:#181818}
.timer{font-variant-numeric:tabular-nums}
.turn{text-align:center;background:#18301b;border:1px solid #39743d;border-radius:20px;padding:8px;margin:8px 0;font-weight:bold}
.frame{display:grid;grid-template-columns:24px 1fr;gap:3px;background:#4d2c1a;border:3px solid #754625;border-radius:9px;padding:5px}
.nums{display:grid;grid-template-rows:repeat(8,1fr);align-items:center;text-align:center;color:#e5c487;font-weight:bold}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;overflow:hidden}
.cell{display:flex;align-items:center;justify-content:center}
.light{background:#e6c38a}
.dark{background:#744521}
.sel{box-shadow:inset 0 0 0 4px #f1d16b}
.possible{box-shadow:inset 0 0 0 4px #9fbd55}
.piece{width:76%;height:76%;border-radius:50%;border:2px solid #555;box-shadow:inset 0 3px 4px #fff5,0 3px 5px #0008}
.piece.black{background:radial-gradient(circle at 35% 28%,#555,#101010 68%)}
.piece.white{background:radial-gradient(circle at 35% 28%,#fff,#d0cbc0 70%)}
.king{border:3px solid #c49b45}
.letters{display:grid;grid-template-columns:24px repeat(8,1fr);text-align:center;color:#e5c487;font-weight:bold;font-size:13px;margin-top:3px}
.msg{text-align:center;background:#171a1d;border-radius:9px;padding:8px;margin-top:8px;color:#ccc;font-size:13px}
.profile-btn{width:100%;margin-top:8px;background:#3a3a5c;border-radius:10px;padding:10px;color:white;font-weight:bold;font-size:14px;border:0;cursor:pointer}

.modal-overlay{
  display:none;position:fixed;inset:0;background:#000a;z-index:1000;
  align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}

.modal{
  background:#1c1f22;border:1px solid #34383c;border-radius:15px;
  padding:20px;max-width:360px;width:100%;color:white;
}
.modal h2{margin:0 0 15px;text-align:center;font-size:18px}

.profile-row{display:flex;gap:6px;margin-bottom:15px}
.profile-row label{display:none}
.profile-row input{
  flex:1;background:#101315;border:1px solid #34383c;border-radius:8px;
  padding:9px;color:white;font-size:14px;
}
.profile-row button{
  background:#2a4f8a;border:0;border-radius:8px;padding:9px 12px;
  color:white;font-weight:bold;font-size:13px;cursor:pointer;
}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stat{
  background:#101315;border:1px solid #34383c;border-radius:10px;
  padding:10px 4px;text-align:center;
}
.stat span{display:block;font-size:20px;font-weight:bold;color:#f1d16b}
.stat small{display:block;font-size:10px;color:#888;margin-top:2px}

.stat-percent{
  text-align:center;background:#101315;border:1px solid #34383c;
  border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px;
}
.stat-percent b{color:#9fbd55}

.close-btn{
  width:100%;background:#ad2922;border:0;border-radius:10px;
  padding:11px;color:white;font-weight:bold;font-size:14px;cursor:pointer;
}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button{border:0;border-radius:10px;padding:12px;color:white;font-weight:bold;font-size:14px;cursor:pointer}
.draw{background:#28751d}
.resign{background:#ad2922}
.restart{background:#2a4f8a;grid-column:1/-1}
</style>
</head>
<body>
<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="menuScreen" class="menu-screen">
  <div class="menu-top">
    <div class="menu-profile">
      <span class="menu-avatar">👤</span>
      <span id="menuNick">Гость</span>
    </div>
  </div>

<div class="menu-buttons">
    <button class="menu-btn play"     id="btnPlay">🎮 Быстрая игра</button>
    <button class="menu-btn create"   id="btnCreate">➕ Создать лобби</button>
    <button class="menu-btn lobbies"  id="btnLobbies">🔍 Открытые лобби</button>
    <button class="menu-btn shop"     id="btnShop">🛒 Магазин</button>
    <button class="menu-btn settings" id="btnSettings">⚙️ Настройки</button>
  </div>
</div>
<div id="gameScreen" class="game-screen" style="display:none">
<div class="game">
  <div class="players">
    <div class="p"><span class="dot white"></span>Игрок 1</div>
    <span id="t1" class="timer">15:00</span>
    <div class="p"><span id="t2" class="timer">15:00</span><span class="dot black"></span>Игрок 2</div>
  </div>

  <div id="turn" class="turn">⚪ Ход игрока 1</div>

  <div class="frame">
    <div class="nums">
      <span>8</span><span>7</span><span>6</span><span>5</span>
      <span>4</span><span>3</span><span>2</span><span>1</span>
    </div>
    <div id="board" class="board"></div>
  </div>

  <div class="letters">
    <span></span><span>A</span><span>B</span><span>C</span>
    <span>D</span><span>E</span><span>F</span><span>G</span><span>H</span>
  </div>

  <div id="msg" class="msg">Выберите белую шашку.</div>
<button id="profileBtn" class="profile-btn">👤 Профиль</button>

<div id="profileModal" class="modal-overlay">
  <div class="modal">
    <h2>👤 Профиль</h2>

    <div class="profile-row">
      <label>Ваше имя:</label>
      <input id="nameInput" type="text" maxlength="20" placeholder="Игрок">
      <button id="saveNameBtn">Сохранить</button>
    </div>

    <div class="stats">
      <div class="stat"><span id="statGames">0</span><small>Партий</small></div>
      <div class="stat"><span id="statWins">0</span><small>Побед</small></div>
      <div class="stat"><span id="statLosses">0</span><small>Поражений</small></div>
      <div class="stat"><span id="statDraws">0</span><small>Ничьих</small></div>
    </div>

    <div class="stat-percent">Процент побед: <b id="statPercent">0%</b></div>

    <button id="closeProfileBtn" class="close-btn">Закрыть</button>
  </div>
</div>
<div class="buttons">
    <button id="draw" class="draw">🤝 Предложить ничью</button>
    <button id="resign" class="resign">🏳️ Сдаться</button>
    <button id="acceptDraw" class="draw" style="display:none">✅ Принять ничью</button>
    <button id="declineDraw" class="resign" style="display:none">❌ Отклонить</button>
    <button id="restart" class="restart" style="display:none">🔄 Новая игра</button>
  </div>
</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   ГЛОБАЛЬНОЕ СОСТОЯНИЕ
============================================================ */

const boardEl = document.getElementById("board");
const turnEl  = document.getElementById("turn");
const msgEl   = document.getElementById("msg");
const restartBtn = document.getElementById("restart");
/* ============================================================
   ЭКРАНЫ (МЕНЮ ↔ ИГРА)
============================================================ */

const menuScreen = document.getElementById("menuScreen");
const gameScreen = document.getElementById("gameScreen");

function showMenu() {
  menuScreen.classList.remove("hidden");
  gameScreen.style.display = "none";
}

function showGame() {
  menuScreen.classList.add("hidden");
  gameScreen.style.display = "block";
}

// кнопка «Быстрая игра» — пока просто открывает игру
document.getElementById("btnPlay").onclick = () => {
  showGame();
};

// заглушки для остальных кнопок (следующими шагами сделаем)
document.getElementById("btnCreate").onclick   = () => { alert("➕ Создать лобби — скоро"); };
document.getElementById("btnLobbies").onclick  = () => { alert("🔍 Открытые лобби — скоро"); };
document.getElementById("btnShop").onclick     = () => { alert("🛒 Магазин — скоро"); };
document.getElementById("btnSettings").onclick = () => { alert("⚙️ Настройки — скоро"); };

/* ============================================================
   ПРОФИЛЬ
============================================================ */

let myUid = null;
let myProfile = { name: "", wins: 0, losses: 0, draws: 0 };

const profileModal  = document.getElementById("profileModal");
const profileBtn    = document.getElementById("profileBtn");
const closeProfileBtn = document.getElementById("closeProfileBtn");
const saveNameBtn   = document.getElementById("saveNameBtn");
const nameInput     = document.getElementById("nameInput");
const menuProfileBtn = document.querySelector(".menu-profile");
if (menuProfileBtn) {
  menuProfileBtn.onclick = () => {
    updateProfileUI();
    profileModal.classList.add("open");
  };
} else {
  console.warn("menu-profile не найден в DOM");
}
 
function updateProfileUI() {
  document.getElementById("statGames").textContent  = myProfile.wins + myProfile.losses + myProfile.draws;
  document.getElementById("statWins").textContent   = myProfile.wins;
  document.getElementById("statLosses").textContent = myProfile.losses;
  document.getElementById("statDraws").textContent  = myProfile.draws;

  const total = myProfile.wins + myProfile.losses + myProfile.draws;
  const pct = total ? Math.round((myProfile.wins / total) * 100) : 0;
  document.getElementById("statPercent").textContent = pct + "%";

  nameInput.value = myProfile.name || "";
  profileBtn.textContent = "👤 " + (myProfile.name || "Профиль");

  const menuNick = document.getElementById("menuNick");
  if (menuNick) menuNick.textContent = myProfile.name || "Гость";
}

profileBtn.onclick = () => {
  updateProfileUI();
  profileModal.classList.add("open");
};

closeProfileBtn.onclick = () => {
  profileModal.classList.remove("open");
};

profileModal.onclick = (e) => {
  if (e.target === profileModal) profileModal.classList.remove("open");
};
/* ============================================================
   ЗВУКИ (Web Audio API)
============================================================ */

let audioCtx = null;

function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// Базовый тон
function playTone(freq, duration, type = "sine", volume = 0.15) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) { /* браузер не поддерживает — тихо игнорим */ }
}

const SFX = {
  // клик / выбор шашки
  select() { playTone(600, 0.06, "sine", 0.08); },

  // обычный ход
  move() { playTone(380, 0.08, "triangle", 0.12); },

  // взятие
  capture() {
    playTone(500, 0.06, "square", 0.12);
    setTimeout(() => playTone(300, 0.1, "square", 0.12), 50);
  },

  // превращение в дамку
  king() {
    playTone(660, 0.08, "sine", 0.12);
    setTimeout(() => playTone(880, 0.1, "sine", 0.12), 70);
    setTimeout(() => playTone(1100, 0.12, "sine", 0.12), 150);
  },

  // победа
  win() {
    playTone(523, 0.12, "sine", 0.15);
    setTimeout(() => playTone(659, 0.12, "sine", 0.15), 120);
    setTimeout(() => playTone(784, 0.2, "sine", 0.15), 240);
  },

  // поражение / сдача
  lose() {
    playTone(400, 0.15, "sine", 0.15);
    setTimeout(() => playTone(300, 0.2, "sine", 0.15), 150);
  },

  // ошибка / недопустимый ход
  error() { playTone(180, 0.12, "sawtooth", 0.1); }
};
let B = Array.from({length:8}, () => Array(8).fill(null));
let current   = "white";
let selected  = null;
let gameOver  = false;
let lastResult = null;

let time = { white: 900, black: 900 };

let myColor     = null;   // "white" | "black"
let onlineReady = false;
let gameRef     = null;   // firebase ref
let lastSyncedBoardHash = ""; // для защиты от лишних render

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ ДОСКИ
============================================================ */

function makeFreshBoard() {
  const b = Array.from({length:8}, () => Array(8).fill(null));
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 8; c++)
      if ((r + c) % 2 === 1) b[r][c] = { color: "black", king: false };

  for (let r = 5; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if ((r + c) % 2 === 1) b[r][c] = { color: "white", king: false };

  return b;
}

B = makeFreshBoard();

/* ============================================================
   БАЗОВАЯ ГЕОМЕТРИЯ
============================================================ */

const inside = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;

/* ============================================================
   ВЗЯТИЯ
============================================================ */

function capturesKing(r, c) {
  const p = B[r]?.[c];
  const out = [];
  if (!p) return out;

  for (const dr of [-1, 1]) {
    for (const dc of [-1, 1]) {
      let nr = r + dr, nc = c + dc;
      let enemy = null;

      while (inside(nr, nc)) {
        const q = B[nr][nc];

        if (!q) {
          if (enemy) out.push({ r: nr, c: nc, cr: enemy.r, cc: enemy.c });
          nr += dr; nc += dc;
          continue;
        }

        if (!enemy) {
          if (q.color === p.color) break;
          enemy = { r: nr, c: nc };
          nr += dr; nc += dc;
          continue;
        }
        break;
      }
    }
  }
  return out;
}

function capturesMan(r, c) {
  const p = B[r]?.[c];
  const out = [];
  if (!p) return out;

  for (const dr of [-1, 1]) {
    for (const dc of [-1, 1]) {
      const er = r + dr, ec = c + dc;
      const lr = r + 2*dr, lc = c + 2*dc;

      if (inside(er, ec) && inside(lr, lc) &&
          B[er][ec] && B[er][ec].color !== p.color &&
          !B[lr][lc]) {
        out.push({ r: lr, c: lc, cr: er, cc: ec });
      }
    }
  }
  return out;
}

function getCaptures(r, c) {
  const p = B[r]?.[c];
  if (!p) return [];
  return p.king ? capturesKing(r, c) : capturesMan(r, c);
}

/* ============================================================
   ОБЫЧНЫЕ ХОДЫ
============================================================ */

function quiet(r, c) {
  const p = B[r]?.[c];
  const out = [];
  if (!p) return out;

  if (p.king) {
    for (const dr of [-1, 1]) {
      for (const dc of [-1, 1]) {
        let nr = r + dr, nc = c + dc;
        while (inside(nr, nc) && !B[nr][nc]) {
          out.push({ r: nr, c: nc });
          nr += dr; nc += dc;
        }
      }
    }
  } else {
    const dr = p.color === "white" ? -1 : 1;
    for (const dc of [-1, 1]) {
      const nr = r + dr, nc = c + dc;
      if (inside(nr, nc) && !B[nr][nc]) out.push({ r: nr, c: nc });
    }
  }
  return out;
}

function anyCapture(color) {
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if (B[r][c]?.color === color && getCaptures(r, c).length) return true;
  return false;
}

function legal(r, c) {
  const p = B[r]?.[c];
  if (!p || p.color !== current) return [];
  return anyCapture(current) ? getCaptures(r, c) : quiet(r, c);
}

/* ============================================================
   ОТРИСОВКА
============================================================ */

function render() {
  boardEl.innerHTML = "";

  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < 8; j++) {
      const r = myColor === "black" ? 7 - i : i;
      const c = myColor === "black" ? 7 - j : j;

      const cell = document.createElement("div");
      cell.className = "cell " + ((r + c) % 2 ? "dark" : "light");

      if (selected && selected.r === r && selected.c === c)
        cell.classList.add("sel");

      if (selected && legal(selected.r, selected.c).some(m => m.r === r && m.c === c))
        cell.classList.add("possible");

      const p = B[r]?.[c];

      if (p) {
        const piece = document.createElement("div");
        piece.className = "piece " + p.color + (p.king ? " king" : "");
        piece.onclick = e => { e.stopPropagation(); onSelect(r, c); };
        cell.appendChild(piece);
      }

      cell.onclick = () => onMove(r, c);
      boardEl.appendChild(cell);
    }
  }
}

/* ============================================================
   ВЫБОР ШАШКИ (локально)
============================================================ */

function localSelect(r, c) {
  const p = B[r]?.[c];
  if (!p) return;

  if (p.color !== current) { msgEl.textContent = "Это шашки соперника."; return; }

const moves = legal(r, c);
if (!moves.length) {
  msgEl.textContent = "Эта шашка сейчас не может ходить.";
  SFX.error();
  return;
}
selected = { r, c };
msgEl.textContent = "Выберите клетку для хода.";
SFX.select();
render();
}

/* ============================================================
   ХОД (локально)
============================================================ */

function localMove(r, c) {
  if (gameOver) return;

  if (!selected) {
    if (B[r]?.[c]) localSelect(r, c);
    return;
  }

  const moves = legal(selected.r, selected.c);
  const target = moves.find(m => m.r === r && m.c === c);

  if (!target) { msgEl.textContent = "❌ Недопустимый ход."; SFX.error(); return; }

  const fromR = selected.r, fromC = selected.c;
  const p = B[fromR][fromC];
  if (!p) return;

  B[r][c] = p;
  B[fromR][fromC] = null;

  if (target.cr !== undefined) B[target.cr][target.cc] = null;
// звук хода: взятие или обычный
  if (target.cr !== undefined) SFX.capture();
else SFX.move();
  // превращение в дамку
 if (!B[r][c].king &&
    ((B[r][c].color === "white" && r === 0) ||
     (B[r][c].color === "black" && r === 7))) {
  B[r][c].king = true;
  SFX.king();
}

  // продолжение взятия
  if (target.cr !== undefined && getCaptures(r, c).length) {
    selected = { r, c };
    msgEl.textContent = "🔄 Продолжите взятие.";
    render();
    return;
  }

  selected = null;
  current = current === "white" ? "black" : "white";

  if (!hasPieces(current)) {
  gameOver = true;
  turnEl.textContent = current === "white" ? "🏆 Победили чёрные" : "🏆 Победили белые";
  msgEl.textContent = "У соперника не осталось шашек.";
  const winner = current === "white" ? "black" : "white";
  if (myColor === winner) SFX.win(); else SFX.lose();
  recordGameResult(winner);
  showRestart();
  render();
  return;
}

  if (!hasMove(current)) {
  gameOver = true;
  turnEl.textContent = current === "white" ? "🏆 Победили чёрные" : "🏆 Победили белые";
  msgEl.textContent = "У соперника нет возможных ходов.";
  const winner = current === "white" ? "black" : "white";
  if (myColor === winner) SFX.win(); else SFX.lose();
  showRestart();
  render();
  return;
}

/* ============================================================
   ПРОВЕРКИ
============================================================ */

function hasPieces(color) {
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if (B[r][c]?.color === color) return true;
  return false;
}

function hasMove(color) {
  // Правило: если есть взятие — только взятия разрешены.
  if (anyCapture(color)) return true;

  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if (B[r][c]?.color === color && quiet(r, c).length) return true;

  return false;
}

  if (winner === "draw") {

/* ============================================================

============================================================ */

function applyServerState(data) {
  const fbBoard = data.board || {};

  B = Array.from({length:8}, (_, r) =>
    Array.from({length:8}, (_, c) => {
      const v = fbBoard[r]?.[c];
      return v === undefined || v === null ? null : v;
    })
  );

  current  = data.current || "white";
  gameOver = data.gameOver === true;
  lastResult = data.result || null;          // ← НОВОЕ
  pendingDrawOffer = data.drawOffer || null; // ← НОВОЕ

  if (data.whiteTime !== undefined) time.white = Number(data.whiteTime) || 0;
  if (data.blackTime !== undefined) time.black = Number(data.blackTime) || 0;

  if (gameOver) showRestart(); else hideRestart();

  paintTimers();
}

function paintTimers() {
  const fmt = s => String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
  document.getElementById("t1").textContent = fmt(Math.max(0, time.white));
  document.getElementById("t2").textContent = fmt(Math.max(0, time.black));
}
